# Kind (Kubernetes in Docker) cluster configuration for the GPU Telemetry Pipeline.
#
# Topology: 1 control-plane + 2 workers  →  mirrors a small production cluster.
#
# The control-plane node has extra port mappings so all services are reachable
# from the host at localhost:<port> without kubectl port-forward.
#
# Usage:
#   kind create cluster --config kind-config.yaml --name gpu-telemetry
#   kubectl get nodes
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 30090  # api-gateway NodePort
        hostPort: 9090
        protocol: TCP
      - containerPort: 30080  # message-queue NodePort
        hostPort: 8080
        protocol: TCP
      - containerPort: 30082  # collector NodePort
        hostPort: 8082
        protocol: TCP
      - containerPort: 30081  # streamer NodePort
        hostPort: 8081
        protocol: TCP
      - containerPort: 30043  # postgres NodePort
        hostPort: 5432
        protocol: TCP

  - role: worker
  - role: worker
