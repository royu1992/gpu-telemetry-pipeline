# Kind (Kubernetes in Docker) cluster configuration for the GPU Telemetry Pipeline.
#
# Topology: 1 control-plane + 2 workers  →  mirrors a small production cluster.
#
# The control-plane node has an extra port mapping on 9090 so the API Gateway
# NodePort service (30090) is reachable from the host at localhost:9090 without
# an additional kubectl port-forward.
#
# Usage:
#   kind create cluster --config kind-config.yaml --name gpu-telemetry
#   kubectl get nodes
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    # Expose API Gateway NodePort to the host so smoke-tests work without
    # a separate port-forward session.
    extraPortMappings:
      - containerPort: 30090
        hostPort: 9090
        protocol: TCP

  - role: worker
    extraMounts:
      - hostPath: docs/dcgm_metrics_20250718_134233.csv
        containerPath: /data/dcgm_metrics_20250718_134233.csv
        readOnly: true
  - role: worker
    extraMounts:
      - hostPath: docs/dcgm_metrics_20250718_134233.csv
        containerPath: /data/dcgm_metrics_20250718_134233.csv
        readOnly: true
