image:
  repository: streamer
  tag: latest
  pullPolicy: IfNotPresent

# CSV data is mounted from the host (kind cluster node) at /data/dcgm_metrics_20250718_134233.csv
# This is set up in kind-config.yaml to avoid ConfigMap 1MiB limit.
config:
  queueAddr:          "http://message-queue:8080"
  csvPath:            "/data/dcgm_metrics_20250718_134233.csv"
  emitInterval:       "1s"
  batchSize:          "10"
  maxRetries:         "3"

# Horizontal Pod Autoscaler — scales streamer pods 1–10 based on CPU.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
