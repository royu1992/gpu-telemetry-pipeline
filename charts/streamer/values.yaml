image:
  repository: streamer
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8081
  nodePort: 30081

# The sample CSV is baked into the streamer runtime image at
# `/data/dcgm_metrics_20250718_134233.csv`. No host mounts or ConfigMaps
# are required for local Kind development.
config:
  queueAddr:          "http://message-queue:8080"
  csvPath:            "/data/dcgm_metrics_20250718_134233.csv"
  emitInterval:       "1s"
  batchSize:          "10"
  maxRetries:         "3"

# Horizontal Pod Autoscaler — scales streamer pods 1–10 based on CPU.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
